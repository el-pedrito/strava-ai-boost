name: ci

# Minimal CI (reliability plan, lot 6). Runs on every PR and on pushes to dev.
# No job ever talks to AWS: there are no credentials in this workflow, IMDS is
# disabled, and `cdk synth` runs against a dummy account. Nothing here calls
# Bedrock (the live prompt-regression runners in scripts/ are never invoked).

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Exact CDK CLI used for synth (the library is pinned in requirements.txt).
  CDK_CLI_VERSION: "2.1145.0"

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      # Some unit tests import aws_cdk, whose jsii runtime needs node.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci.txt
      - name: Unit + regression tests
        run: pytest tests/unit tests/regression -q

  frontend:
    name: frontend tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  cdk:
    name: cdk synth + cdk-nag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci.txt
      # Dummy context: the stacks only need an account/region to resolve ARNs.
      # .env.agentcore, .bedrock_agentcore.yaml and cdk.context.json are
      # gitignored, so AgentCore ARNs/memory id synthesize as empty strings.
      - name: cdk synth
        run: >-
          npx --yes aws-cdk@${{ env.CDK_CLI_VERSION }} synth --quiet
          -c account=123456789012 -c region=us-east-1
      - name: CDK infrastructure tests
        run: pytest tests/test_cdk_infrastructure.py -q
      # AwsSolutions checks. Fails on any unsuppressed ERROR (warnings are only
      # reported). Justified suppressions live in stacks/nag_suppressions.py.
      - name: cdk synth with cdk-nag
        run: >-
          npx --yes aws-cdk@${{ env.CDK_CLI_VERSION }} synth --quiet
          -c account=123456789012 -c region=us-east-1 -c nag=true
      - name: Upload cdk-nag reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdk-nag-reports
          path: cdk.out/AwsSolutions-*-NagReport.csv
          if-no-files-found: ignore

  security:
    name: dependency audit + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install audit tools
        run: pip install pip-audit==2.10.1 detect-secrets==1.5.0
      # Each check runs even if a previous one failed, so one report shows all.
      - name: pip-audit (CDK app + CI deps)
        run: pip-audit --progress-spinner off -r requirements.txt -r requirements-ci.txt
      - name: pip-audit (Lambda layer)
        if: success() || failure()
        run: pip-audit --progress-spinner off -r lambda_layer/requirements.txt
      - name: pip-audit (Web Push layer)
        if: success() || failure()
        run: pip-audit --progress-spinner off -r lambda_layer_push/requirements.txt
      - name: pip-audit (coach_chat runtime)
        if: success() || failure()
        run: pip-audit --progress-spinner off -r src/coach_chat/requirements.txt
      - name: npm audit (frontend)
        if: success() || failure()
        working-directory: frontend
        run: npm audit --audit-level=high
      # Rescan the tracked files against .secrets.baseline and fail on any
      # (file, hashed secret) pair the baseline does not already know. Comparing
      # hashes rather than line numbers keeps unrelated edits from failing CI.
      # To accept a false positive: `detect-secrets scan > .secrets.baseline`
      # locally, or add an inline `# pragma: allowlist secret`.
      - name: detect-secrets
        if: success() || failure()
        run: |
          cp .secrets.baseline "$RUNNER_TEMP/secrets.baseline.orig"
          detect-secrets scan --baseline .secrets.baseline
          python - <<'PY'
          import json, os, sys

          def keys(path):
              with open(path) as f:
                  results = json.load(f)["results"]
              return {(name, s["hashed_secret"]) for name, items in results.items() for s in items}

          orig = os.path.join(os.environ["RUNNER_TEMP"], "secrets.baseline.orig")
          added = sorted(keys(".secrets.baseline") - keys(orig))
          for name, _ in added:
              print(f"::error file={name}::detect-secrets: potential secret not in .secrets.baseline")
          sys.exit(1 if added else 0)
          PY
