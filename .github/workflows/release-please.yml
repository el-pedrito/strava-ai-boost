name: release-please

# Release management via conventional commits. When commits land on the release
# branch (main), release-please opens/updates a release PR that bumps the version
# and CHANGELOG.md. Merging that PR tags the release and creates a GitHub Release.
# Day-to-day work happens on dev via feature-branch PRs; releases are cut when
# dev is promoted to main.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
